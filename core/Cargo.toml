[package]
name = "sorapatch-core"
version = "1.1.0"
edition = "2021"
description = "Checks a disc image, decrypts its EBOOT.BIN and applies a VCDIFF (xdelta3 -S none) patch, streaming, pure Rust."
license = "GPL-3.0-or-later"  # since P1.10 EBOOT decrypt (core/src/pspcrypt.rs, port of GPL code); see README.md "Licence and credits"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
fs4 = "0.13"
aes = "0.8"
sha1 = "0.10"
